<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#e8e8e8}iframe{border:0;display:block;transform-origin:top left}#wrap{margin:0 auto;overflow:hidden}</style></head><body><div id="wrap"><iframe title="Pillow Paws responsive preview" src="/"></iframe></div><script>const query=new URLSearchParams(location.search);const w=Number(query.get('w')||1440),h=Number(query.get('h')||900);const scale=Math.min(innerWidth/w,innerHeight/h,1),frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap');frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';</script></body></html>
